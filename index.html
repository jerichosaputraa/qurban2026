<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Panitia Qurban RT 06</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 8px; }
        
        /* Animasi Teks Berjalan */
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 15s linear infinite; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- Notifikasi Realtime -->
    <div id="notificationBanner" class="hidden fixed top-0 w-full bg-emerald-600 text-white py-2 z-[9999] shadow-lg overflow-hidden whitespace-nowrap">
        <div id="marqueeText" class="animate-marquee font-bold text-sm px-4">
            <!-- Teks notifikasi akan diisi oleh JS -->
        </div>
    </div>

    <!-- Section Login -->
    <div id="loginSection" class="flex-1 flex flex-col justify-center items-center px-4 py-12 bg-emerald-800 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md relative z-10">
            <h2 class="text-2xl font-bold text-emerald-900 font-serif text-center mb-6">Panel Panitia Qurban</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <input type="password" id="pinInput" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 text-center text-2xl tracking-widest font-mono" placeholder="••••••">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg">Masuk</button>
            </form>
        </div>
    </div>

    <!-- Section Utama -->
    <div id="mainAppSection" class="hidden flex-1 flex-col">
        <header class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-50">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h1 class="font-bold text-lg">Aplikasi Pendataan Qurban</h1>
                <button onclick="handleLogout()" class="text-sm bg-red-600 px-3 py-2 rounded font-medium">Keluar</button>
            </div>
        </header>

        <main class="flex-1 p-4 flex flex-col items-center">
            <!-- (Sisa konten halaman Dashboard, Register, Export tidak diubah fungsinya, hanya ditambah listener Realtime di script bawah) -->
            <div id="pageDashboard" class="w-full max-w-5xl hidden relative z-10 mt-4 pb-12">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                    <div onclick="showPage('register')" class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-200 cursor-pointer text-center">
                        <h3 class="text-lg font-bold text-emerald-900">Pendataan Baru</h3>
                    </div>
                    <div onclick="showPage('export')" class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-200 cursor-pointer text-center">
                        <h3 class="text-lg font-bold text-blue-900">Export Data</h3>
                    </div>
                </div>
                <div id="listContainer" class="bg-white rounded-2xl shadow-sm p-6 overflow-x-auto min-h-[300px]">
                    <table class="w-full text-left min-w-[600px]">
                        <thead><tr class="text-gray-500 border-b"><th class="pb-3">Nama</th><th class="pb-3">WA</th><th class="pb-3">Pilihan</th><th class="pb-3">Tiket</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
            
            <div id="pageRegister" class="w-full max-w-2xl hidden relative z-10">
                <button onclick="showPage('dashboard')" class="bg-white p-2 rounded-full shadow-sm text-emerald-700 mb-4">Kembali</button>
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-200">
                    <form id="qurbanForm" onsubmit="handleRegistrationSubmit(event)">
                        <input type="text" id="name" required class="w-full mb-4 px-4 py-3 border rounded-xl" placeholder="Nama Warga">
                        <input type="tel" id="phone" required class="w-full mb-4 px-4 py-3 border rounded-xl" placeholder="Nomor WhatsApp">
                        <select id="meatChoice" class="w-full mb-4 px-4 py-3 border rounded-xl">
                            <option value="sapi">Daging Sapi</option>
                            <option value="kambing">Daging Kambing</option>
                        </select>
                        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 text-white py-4 rounded-xl">Buat e-Kupon</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://jyjjvbhoiajnijfrcbtu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp5amp2YmhvaWFqbmlqZnJjYnR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Nzg1NzYsImV4cCI6MjA5NDI1NDU3Nn0.0T8f0rPPdBwbFW0sxwjp6NgJrWgyjfCTcYOKnWPaHQA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- SISTEM REALTIME ---
        const channel = supabaseClient.channel('realtime:registrations');
        channel
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'registrations' }, payload => {
            const newEntry = payload.new;
            showNotification(`Warga baru: ${newEntry.name} (${newEntry.meat_choice}) telah terdaftar!`);
            if (!document.getElementById('pageDashboard').classList.contains('hidden')) loadData();
          })
          .subscribe();

        function showNotification(text) {
            const banner = document.getElementById('notificationBanner');
            const marquee = document.getElementById('marqueeText');
            marquee.textContent = text;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 15000); // Hilang setelah 15 detik
        }

        // --- SISTEM NAVIGATION & HISTORY API (TETAP SAMA) ---
        function showPage(page, pushToHistory = true) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainAppSection').classList.remove('hidden');
            
            document.getElementById('pageDashboard').classList.add('hidden');
            document.getElementById('pageRegister').classList.add('hidden');
            document.getElementById('pageExport').classList.add('hidden');

            if (page === 'dashboard') {
                document.getElementById('pageDashboard').classList.remove('hidden');
                loadData();
            } else if (page === 'register') {
                document.getElementById('pageRegister').classList.remove('hidden');
            }
            if (pushToHistory) history.pushState({ page: page }, '', '#' + page);
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.page) showPage(e.state.page, false);
            else showPage('login', false);
        });

        async function loadData() {
            const { data } = await supabaseClient.from('registrations').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(r => `<tr><td class="py-3">${r.name}</td><td>${r.phone}</td><td>${r.meat_choice}</td><td>${r.ticket_number}</td></tr>`).join('');
        }

        async function handleRegistrationSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const meat = document.getElementById('meatChoice').value;
            
            // Insert data
            await supabaseClient.from('registrations').insert([{ name, phone, meat_choice: meat, ticket_number: '001' }]);
            alert("Berhasil!");
            showPage('dashboard');
        }

        function handleLogin(e) { e.preventDefault(); if(document.getElementById('pinInput').value === "123456") showPage('dashboard'); }
        function handleLogout() { location.reload(); }
    </script>
</body>
</html>
